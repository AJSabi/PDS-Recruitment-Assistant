name: Security Nuxt Family Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-nuxt-family-preview.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use npm 11 resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Generate Nuxt candidate and diagnose cac
        shell: bash
        run: |
          npm pkg set dependencies.nuxt=4.5.2
          npm pkg set 'overrides.@nuxt/devtools=3.4.1'
          npm pkg set 'overrides.@nuxt/vite-builder=4.5.2'
          npm pkg set 'overrides.@nuxt/nitro-server=4.5.2'
          npm pkg set 'overrides.@nuxt/kit=4.5.2'
          npm pkg set 'overrides.@nuxt/schema=4.5.2'
          npm install --include=dev --ignore-scripts
          echo '=== npm explain cac ==='
          npm explain cac || true
          echo '=== npm ls cac ==='
          npm ls cac --all || true
          echo '=== lock cac entries ==='
          node <<'NODE'
          const lock = require('./package-lock.json')
          for (const [path, meta] of Object.entries(lock.packages || {})) {
            const deps = meta.dependencies || {}
            if (path.endsWith('/cac') || Object.prototype.hasOwnProperty.call(deps, 'cac')) {
              console.log(path || '<root>', JSON.stringify({ version: meta.version, cac: deps.cac }))
            }
          }
          NODE
          echo '=== registry dependency declarations ==='
          for spec in 'nuxt@4.5.2' '@nuxt/kit@4.5.2' '@nuxt/vite-builder@4.5.2' 'unimport@6.4.0' 'unplugin@3.3.0' 'vite@8.0.16' 'vite@8.2.2'; do
            echo "--- $spec ---"
            npm view "$spec" dependencies.cac optionalDependencies.cac peerDependencies.cac --json || true
          done
