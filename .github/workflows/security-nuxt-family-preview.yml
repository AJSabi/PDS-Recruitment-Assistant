name: Promote Nuxt Source Compatibility

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-nuxt-family-preview.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pds-skill-matrix
          fetch-depth: 2

      - name: Guard promotion parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "c2523de459ab394e51c09c4f059a665090ebb05a"
          test "$(git branch --show-current)" = "feature/pds-skill-matrix"

      - name: Apply proven compatibility edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const appPath = 'app/app.vue'
          let app = fs.readFileSync(appPath, 'utf8')
          const oldLink = '  link: i18nHead.value.link,'
          const oldMeta = '  meta: i18nHead.value.meta,'
          if (!app.includes(oldLink) || !app.includes(oldMeta)) throw new Error('Expected i18n head lines not found')
          app = app.replace(oldLink, '  link: i18nHead.value.link as any,')
          app = app.replace(oldMeta, '  meta: i18nHead.value.meta as any,')
          fs.writeFileSync(appPath, app)

          const files = [
            'app/components/PdsJdSkillMatrix.vue',
            'app/pages/dashboard/jobs/[id]/index.vue',
            'app/pages/dashboard/jobs/[id]/pds-ranking.vue',
            'app/pages/dashboard/jobs/[id]/pds-register.vue',
            'app/pages/dashboard/pds-candidates.vue',
          ]
          let replacements = 0
          const pattern = /((?:\w+Error)|error)\?\.data\?\.statusMessage/g
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8')
            source = source.replace(pattern, (_match, name) => {
              replacements += 1
              return `(${name}?.data as { statusMessage?: string } | undefined)?.statusMessage`
            })
            fs.writeFileSync(file, source)
          }
          if (replacements !== 6) throw new Error(`Expected 6 request-error typing replacements, got ${replacements}`)
          console.log(`Applied ${replacements + 2} proven compatibility edits.`)
          NODE

      - name: Verify change scope
        shell: bash
        run: |
          git diff --check
          expected=$(printf '%s\n' \
            'app/app.vue' \
            'app/components/PdsJdSkillMatrix.vue' \
            'app/pages/dashboard/jobs/[id]/index.vue' \
            'app/pages/dashboard/jobs/[id]/pds-ranking.vue' \
            'app/pages/dashboard/jobs/[id]/pds-register.vue' \
            'app/pages/dashboard/pds-candidates.vue' | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install current dependency graph
        run: npm ci --include=dev

      - name: Typecheck current framework
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Commit proven source compatibility
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/app.vue \
            app/components/PdsJdSkillMatrix.vue \
            'app/pages/dashboard/jobs/[id]/index.vue' \
            'app/pages/dashboard/jobs/[id]/pds-ranking.vue' \
            'app/pages/dashboard/jobs/[id]/pds-register.vue' \
            app/pages/dashboard/pds-candidates.vue
          git commit -m "fix: prepare source for Nuxt 4.5"
          git push origin HEAD:feature/pds-skill-matrix
