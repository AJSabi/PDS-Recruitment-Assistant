name: Promote Validated Nuxt 4.5 Dependencies

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-nuxt-family-preview.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pds-skill-matrix
          fetch-depth: 2

      - name: Guard promotion parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "13b7d11c3d8e6ba13fd9d5618fbb1916f676e3e1"
          test "$(git branch --show-current)" = "feature/pds-skill-matrix"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use npm 11 resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Generate deterministic Nuxt-family candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.dependencies.nuxt = '4.5.2'
          pkg.devDependencies = {
            ...(pkg.devDependencies || {}),
            cac: '7.0.0'
          }
          pkg.overrides = {
            ...(pkg.overrides || {}),
            '@nuxt/devtools': '3.4.1',
            '@nuxt/vite-builder': '4.5.2',
            '@nuxt/nitro-server': '4.5.2',
            '@nuxt/kit': '4.5.2',
            '@nuxt/schema': '4.5.2',
            unhead: '3.4.0',
            '@bomb.sh/tab': '0.0.22'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --include=dev --ignore-scripts
          rm -rf node_modules

      - name: Prove lockfile with clean install
        run: npm ci --include=dev

      - name: Verify change scope
        shell: bash
        run: |
          git diff --check
          expected=$(printf '%s\n' package.json package-lock.json | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Audit candidate
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 3 || (counts.total ?? 0) > 4) {
            console.error('Nuxt candidate did not meet the validated security ceiling.')
            process.exit(1)
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Commit validated dependency graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Nuxt family to 4.5.2"
          git push origin HEAD:feature/pds-skill-matrix
