name: Lock Refresh

on:
  push:
    paths:
      - '.github/workflows/lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Use validated npm resolver
        run: npm install --global npm@11.6.0
      - name: Capture current lock identity
        id: current-lock
        run: |
          echo "blob=$(git hash-object package-lock.json)" >> "$GITHUB_OUTPUT"
          git status --short package-lock.json
      - name: Refresh lock metadata only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify locked security overrides
        run: |
          node <<'NODE'
          const l = require('./package-lock.json')
          const xmldom = l.packages['node_modules/@xmldom/xmldom']?.version
          const qs = l.packages['node_modules/qs']?.version
          console.log('@xmldom/xmldom', xmldom)
          console.log('qs', qs)
          if (xmldom !== '0.8.15' || qs !== '6.16.0') process.exit(1)
          NODE
      - name: Verify branch has not moved
        run: |
          remote_sha="$(git ls-remote origin refs/heads/feature/pds-skill-matrix | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:package-lock.json)" = "${{ steps.current-lock.outputs.blob }}"
      - name: Commit refreshed lock only
        run: |
          test -n "$(git status --short package-lock.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "fix: synchronize secure dependency lock"
          git push origin HEAD:feature/pds-skill-matrix
      - name: Upload refreshed lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
