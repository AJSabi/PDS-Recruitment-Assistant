name: Typecheck Diagnostics

on:
  push:
    paths:
      - '.github/workflows/typecheck-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Use validated npm resolver
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Capture typecheck diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "$code" > typecheck.exit
          exit 0
      - name: Upload typecheck diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: |
            typecheck.log
            typecheck.exit
          if-no-files-found: error
          retention-days: 1
      # Temporary closure diagnostic; remove after exact-head validation.
