name: Promote Lucide Package Migration

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/deprecation-hardening-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Guard migration parent
        shell: bash
        run: |
          parent=$(git rev-parse HEAD^)
          if [ "${parent}" != "05331c9b7f8a9a9cf923525180be2274c92f0e44" ]; then
            echo "Unexpected migration parent: ${parent}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Confirm replacement package
        run: |
          test "$(npm view @lucide/vue@1.37.0 version)" = "1.37.0"
          npm view lucide-vue-next deprecated

      - name: Migrate Lucide package and imports
        shell: bash
        run: |
          before=$(git grep -l "lucide-vue-next" -- 'app/**/*.vue' 'app/**/*.ts' 'app/**/*.tsx' 'app/**/*.js' 'app/**/*.jsx' 2>/dev/null | wc -l)
          echo "Source files to migrate: ${before}"
          if [ "${before}" -lt 1 ]; then
            echo 'Expected existing Lucide imports but found none'
            exit 1
          fi

          git grep -Il -z "lucide-vue-next" -- 'app/**/*.vue' 'app/**/*.ts' 'app/**/*.tsx' 'app/**/*.js' 'app/**/*.jsx' 2>/dev/null \
            | xargs -0 -r sed -i "s/from 'lucide-vue-next'/from '@lucide\/vue'/g; s/from \"lucide-vue-next\"/from \"@lucide\/vue\"/g"

          # Lucide v1 intentionally removed brand icons. Preserve repository-link semantics
          # with the supported neutral GitBranch icon in the three former Github usages.
          for file in \
            app/components/PreviewUpsellModal.vue \
            app/components/PublicNavBar.vue \
            app/pages/index.vue; do
            sed -i 's/\bGithub\b/GitBranch/g' "$file"
          done

          if git grep -n "lucide-vue-next" -- app 2>/dev/null; then
            echo 'Deprecated Lucide source imports remain after migration'
            exit 1
          fi
          if git grep -nE "import .*\bGithub\b.*from ['\"]@lucide/vue['\"]" -- app 2>/dev/null; then
            echo 'Removed Github brand icon is still imported from @lucide/vue'
            exit 1
          fi

          npm pkg delete dependencies.lucide-vue-next
          npm pkg set dependencies.@lucide/vue=1.37.0
          npm install --package-lock-only --ignore-scripts

      - name: Prove migration with clean install
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Verify Lucide dependency graph
        shell: bash
        run: |
          npm ls @lucide/vue --all
          if npm ls lucide-vue-next --all 2>/dev/null | grep -q 'lucide-vue-next@'; then
            echo 'Deprecated lucide-vue-next is still installed'
            exit 1
          fi
          node <<'NODE'
          const pkg = require('./package.json')
          if (pkg.dependencies?.['@lucide/vue'] !== '1.37.0') throw new Error('Expected @lucide/vue 1.37.0')
          if (pkg.dependencies?.['lucide-vue-next']) throw new Error('Deprecated lucide-vue-next remains in package.json')
          NODE

      - name: Require zero npm audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const total = report.metadata?.vulnerabilities?.total ?? 0
          console.log(`Audit total=${total}`)
          if (total !== 0) process.exit(1)
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify migration diff scope
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json|app/.*\.(vue|ts|tsx|js|jsx))$' || true)
          if [ -n "${unexpected}" ]; then
            echo 'Unexpected changed files:'
            echo "${unexpected}"
            exit 1
          fi
          git diff --check
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs')
          const special = new Set([
            'app/components/PreviewUpsellModal.vue',
            'app/components/PublicNavBar.vue',
            'app/pages/index.vue',
          ])
          const changed = execFileSync('git', ['diff', '--name-only', '--', 'app'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean)
          for (const file of changed) {
            const original = execFileSync('git', ['show', `HEAD:${file}`], { encoding: 'utf8' })
            let expected = original
              .replaceAll("from 'lucide-vue-next'", "from '@lucide/vue'")
              .replaceAll('from "lucide-vue-next"', 'from "@lucide/vue"')
            if (special.has(file)) expected = expected.replaceAll('Github', 'GitBranch')
            const actual = fs.readFileSync(file, 'utf8')
            if (actual !== expected) throw new Error(`Unexpected source change in ${file}`)
          }
          console.log(`Verified ${changed.length} source files contain only approved Lucide migration edits`)
          NODE

      - name: Commit validated Lucide migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app
          git commit -m 'chore: migrate to supported Lucide Vue package'
          git push origin HEAD:feature/pds-skill-matrix
