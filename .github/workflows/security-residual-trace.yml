name: Promote Zero-Audit Dependency Pins

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-residual-trace.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard promotion parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "79b6270089b4942c27570e41e336f49b8ab6d248"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Generate validated zero-audit graph
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'brace-expansion': '5.0.9',
            'js-yaml': '4.3.1',
            'dompurify': '3.4.14'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --include=dev --ignore-scripts
          rm -rf node_modules

      - name: Prove lockfile with clean install
        run: npm ci --include=dev

      - name: Verify change scope
        shell: bash
        run: |
          changed="$(git status --porcelain | awk '{print $2}' | sort -u)"
          printf '%s\n' "$changed"
          test "$changed" = $'package-lock.json\npackage.json'

      - name: Verify patched dependency paths
        run: npm ls brace-expansion js-yaml dompurify --all

      - name: Require zero npm audit findings
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          if ((counts.total ?? 0) !== 0) process.exit(1)
          NODE
          rm -f npm-audit.json

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Commit validated dependency graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: eliminate residual npm audit findings"
          git push origin HEAD:feature/pds-skill-matrix
