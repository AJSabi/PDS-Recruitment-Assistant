name: Security Residual Remediation Preview

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-residual-trace.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Confirm patched package versions
        run: |
          npm view brace-expansion@5.0.9 version
          npm view js-yaml@4.3.1 version
          npm view dompurify@3.4.14 version

      - name: Generate residual security candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'brace-expansion': '5.0.9',
            'js-yaml': '4.3.1',
            'dompurify': '3.4.14'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --include=dev --ignore-scripts
          rm -rf node_modules

      - name: Prove lockfile with clean install
        run: npm ci --include=dev

      - name: Verify patched dependency paths
        run: |
          npm ls brace-expansion js-yaml dompurify --all

      - name: Require zero npm audit findings
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`[${String(item.severity).toUpperCase()}] ${name} | ${item.isDirect ? 'direct' : 'transitive'} | range=${item.range}`)
          }
          if ((counts.total ?? 0) !== 0) process.exit(1)
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: residual-security-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
