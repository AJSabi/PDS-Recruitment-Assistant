name: Security Better Auth Preview

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-better-auth-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Inspect target package metadata
        run: |
          npm view better-auth@1.6.30 version dependencies peerDependencies --json
          npm view @better-auth/sso@1.6.30 version dependencies peerDependencies --json

      - name: Generate Better Auth candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.dependencies['better-auth'] = '1.6.30'
          pkg.dependencies['@better-auth/sso'] = '1.6.30'
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'better-call': '1.4.0',
            '@better-auth/core': '1.6.30',
            '@better-auth/utils': '0.4.2',
            '@better-fetch/fetch': '1.3.1'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --include=dev --ignore-scripts
          rm -rf node_modules

      - name: Prove lockfile with clean install
        run: npm ci --include=dev

      - name: Inspect resolved auth graph
        run: npm ls better-auth @better-auth/sso @better-auth/core @better-auth/utils @better-fetch/fetch better-call --all

      - name: Audit candidate
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`[${String(item.severity).toUpperCase()}] ${name} | ${item.isDirect ? 'direct' : 'transitive'} | range=${item.range}`)
          }
          if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 0) {
            console.error('Better Auth candidate still contains critical/high findings.')
            process.exit(1)
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload candidate manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: better-auth-security-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
