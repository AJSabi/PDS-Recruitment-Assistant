name: Promote Validated Better Auth Dependencies

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-better-auth-preview.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pds-skill-matrix
          fetch-depth: 2

      - name: Guard promotion parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "8f3ae160dd8fe167d4c728f820a6dbfd63d5daeb"
          test "$(git branch --show-current)" = "feature/pds-skill-matrix"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Generate validated Better Auth graph
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.dependencies['better-auth'] = '1.6.30'
          pkg.dependencies['@better-auth/sso'] = '1.6.30'
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'better-call': '1.4.0',
            '@better-auth/core': '1.6.30',
            '@better-auth/utils': '0.4.2',
            '@better-fetch/fetch': '1.3.1'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --include=dev --ignore-scripts
          rm -rf node_modules

      - name: Prove lockfile with clean install
        run: npm ci --include=dev

      - name: Verify change scope
        shell: bash
        run: |
          git diff --check
          expected=$(printf '%s\n' package-lock.json package.json | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"

      - name: Inspect resolved auth graph
        run: npm ls better-auth @better-auth/sso @better-auth/core @better-auth/utils @better-fetch/fetch better-call --all

      - name: Audit validated graph
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const vulnerabilities = report.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          for (const [name, item] of Object.entries(vulnerabilities)) {
            console.log(`[${String(item.severity).toUpperCase()}] ${name} | ${item.isDirect ? 'direct' : 'transitive'} | range=${item.range}`)
          }
          const authNames = ['better-auth', '@better-auth/sso', '@better-auth/core', '@better-auth/utils', '@better-fetch/fetch', 'better-call']
          const vulnerableAuth = authNames.filter(name => vulnerabilities[name])
          if (vulnerableAuth.length) process.exit(1)
          if ((counts.critical ?? 0) > 0 || (counts.high ?? 0) > 2 || (counts.moderate ?? 0) > 1 || (counts.total ?? 0) > 3) process.exit(1)
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Commit validated dependency graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Better Auth family to 1.6.30"
          git push origin HEAD:feature/pds-skill-matrix
