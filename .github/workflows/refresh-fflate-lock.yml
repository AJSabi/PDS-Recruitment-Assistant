name: Refresh fflate lockfile

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - package.json
      - .github/workflows/refresh-fflate-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/pds-skill-matrix
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts --include=dev

      - name: Verify patched fflate resolution
        run: |
          node -e "const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/fflate']?.version; if(v!=='0.4.9'){console.error('Expected fflate 0.4.9, found',v);process.exit(1)}; console.log('fflate',v)"

      - name: Commit synchronized lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-fflate-lock.yml
          git add package-lock.json package.json
          git commit -m "chore(security): refresh lockfile for fflate 0.4.9"
          git push origin HEAD:feature/pds-skill-matrix
