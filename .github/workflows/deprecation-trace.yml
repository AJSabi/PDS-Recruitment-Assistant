name: Trial Better SQLite Deprecation Cleanup

on:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/deprecation-trace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Guard trial parent
        shell: bash
        run: |
          parent=$(git rev-parse HEAD^)
          if [ "${parent}" != "7cd05efd8c31380e2ad9bc77cebbf318ceb18745" ]; then
            echo "Unexpected trial parent: ${parent}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Refresh Better SQLite within compatible major
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact better-sqlite3@12.11.1
          node -p "require('./package.json').dependencies['better-sqlite3']"

      - name: Prove clean install
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Require deprecated installer removal
        shell: bash
        run: |
          if npm ls prebuild-install --all 2>/dev/null | grep -q 'prebuild-install@'; then
            npm explain prebuild-install || true
            echo 'better-sqlite3 12.11.1 still depends on deprecated prebuild-install; do not promote'
            exit 1
          fi

      - name: Require zero npm audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const total = report.metadata?.vulnerabilities?.total ?? 0
          console.log(`Audit total=${total}`)
          if (total !== 0) process.exit(1)
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify diff scope
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json)$' || true)
          if [ -n "${unexpected}" ]; then
            echo 'Unexpected changed files:'
            echo "${unexpected}"
            exit 1
          fi
          git diff --check

      - name: Commit validated Better SQLite refresh
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: refresh better-sqlite3 dependency'
          git push origin HEAD:feature/pds-skill-matrix
