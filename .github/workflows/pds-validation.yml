name: PDS Validation

on:
  push:
    branches:
      - feature/pds-skill-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate targeted security dependency candidate
        shell: bash
        run: |
          npm pkg set 'dependencies.nuxt=4.5.2'
          npm pkg set 'dependencies.better-auth=1.6.30'
          npm pkg set 'dependencies.@better-auth/sso=1.6.30'
          npm pkg set 'overrides.tar=7.5.22'
          npm pkg set 'overrides.axios=1.20.0'
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Upload security dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: security-dependency-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install candidate dependencies
        run: npm ci --include=dev

      - name: Dependency security audit summary
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {})
            .map(([name, value]) => ({ name, ...value }))
            .sort((a, b) => {
              const rank = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 }
              return (rank[b.severity] ?? -1) - (rank[a.severity] ?? -1) || a.name.localeCompare(b.name)
            })
          for (const item of vulnerabilities) {
            const fix = item.fixAvailable === true
              ? 'yes'
              : item.fixAvailable && typeof item.fixAvailable === 'object'
                ? `${item.fixAvailable.name}@${item.fixAvailable.version}${item.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                : 'no'
            console.log(`[${String(item.severity).toUpperCase()}] ${item.name} | ${item.isDirect ? 'direct' : 'transitive'} | range=${item.range} | fix=${fix}`)
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
