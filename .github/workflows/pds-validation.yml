name: PDS Validation

on:
  push:
    branches:
      - feature/pds-skill-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-release-secret-0123456789abcdef
      BETTER_AUTH_URL: https://validation.example.com
      S3_ENDPOINT: https://s3.validation.example.com
      S3_ACCESS_KEY: validation-access-key
      S3_SECRET_KEY: validation-secret-key
      S3_BUCKET: validation-bucket
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Use validated npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Production release preflight
        run: npm run release:preflight

      - name: Inspect Better Auth security peer graph
        shell: bash
        run: |
          echo 'Current installed graph:'
          npm ls better-auth @better-auth/sso @better-auth/core @better-auth/utils better-call --all || true
          echo 'Target Better Auth dependencies:'
          npm view better-auth@1.6.30 dependencies peerDependencies --json
          echo 'Target SSO dependencies and peers:'
          npm view @better-auth/sso@1.6.30 dependencies peerDependencies --json

      - name: Dependency security audit summary
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {})
            .map(([name, value]) => ({ name, ...value }))
            .sort((a, b) => {
              const rank = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 }
              return (rank[b.severity] ?? -1) - (rank[a.severity] ?? -1) || a.name.localeCompare(b.name)
            })
          for (const item of vulnerabilities) {
            const fix = item.fixAvailable === true
              ? 'yes'
              : item.fixAvailable && typeof item.fixAvailable === 'object'
                ? `${item.fixAvailable.name}@${item.fixAvailable.version}${item.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                : 'no'
            console.log(`[${String(item.severity).toUpperCase()}] ${item.name} | ${item.isDirect ? 'direct' : 'transitive'} | range=${item.range} | fix=${fix}`)
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
