name: Security Override Promotion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-nuxt-preview.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pds-skill-matrix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate targeted security candidate
        shell: bash
        run: |
          npm pkg set overrides.tar=7.5.22
          npm pkg set overrides.axios=1.20.0
          npm install --package-lock-only --ignore-scripts

      - name: Install candidate graph
        run: npm ci --include=dev

      - name: Audit candidate
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          if ((counts.critical ?? 0) > 1 || (counts.high ?? 0) > 8 || (counts.total ?? 0) > 11) {
            console.error('Security candidate regressed beyond the validated audit ceiling.')
            process.exit(1)
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Commit validated manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m "fix: refresh transitive security overrides"
          git push origin HEAD:feature/pds-skill-matrix
