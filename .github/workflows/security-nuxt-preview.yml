name: Security Nuxt Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pds-skill-matrix
    paths:
      - .github/workflows/security-nuxt-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
      BETTER_AUTH_SECRET: validation-only-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate targeted security candidate
        shell: bash
        run: |
          npm pkg set dependencies.nuxt=4.5.2
          npm pkg set overrides.tar=7.5.22
          npm pkg set overrides.axios=1.20.0
          npm update nuxt @nuxt/nitro-server @nuxt/vite-builder rolldown --package-lock-only --ignore-scripts

      - name: Install candidate graph
        run: npm ci --include=dev

      - name: Audit candidate
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log(`Audit counts: critical=${counts.critical ?? 0}, high=${counts.high ?? 0}, moderate=${counts.moderate ?? 0}, low=${counts.low ?? 0}, total=${counts.total ?? 0}`)
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`[${String(item.severity).toUpperCase()}] ${name} | ${item.isDirect ? 'direct' : 'transitive'} | range=${item.range}`)
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload candidate manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-security-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
